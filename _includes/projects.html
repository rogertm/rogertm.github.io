{% assign projects = site.projects | sort:"order" %}
{% for project in projects %}
<article>
    <h2 class="h3"><a href="{{ project.link }}" target="_blank">{{ project.title }}</a></h2>
    <h3 class="mb-3 fs-5">{{ project.subtitle }}</h3>
    {{ project.content }}
    {% for stack in project.stack %}
        <code class="me-2">{{ stack }}</code>
    {% endfor %}
</article>
{% endfor %}
