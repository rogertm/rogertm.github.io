{% assign portfolio = site.portfolio | sort:"order" %}

<div class="row row-cols-1 row-cols-md-2 g-4">
    {% for item in portfolio %}
    <div class="col mb-4">
        <div class="card border-0 border-bottom mb-4 rounded-0 h-100">
            <img class="card-img-top img-fluid" src="{{ item.thumbnail }}">
            <div class="card-body p-0 pt-4">
                <h2 class="card-title h4">
                    <a href="{{ item.link }}" class="stretched-link" target="_blank">
                        {{ item.title }}
                    </a>
                </h2>
                <h3 class="mb-3 fs-6"><strong>{{ item.subtitle }}</strong></h3>
                <div class="card-text">{{ item.content }}</div>
            </div>
            <div class="card-footer border-0 bg-dark p-0 pb-3">
                {% for stack in item.stack %}
                    <code class="me-2">{{ stack }}</code>
                {% endfor %}
            </div>
        </div>
    </div>
    {% endfor %}

</div>
